<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fey Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Mimic Framer Motion's spring physics (visualDuration: 0.5, bounce: 0.2) */
    .spring-transition {
      transition: transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    
    .opacity-transition {
      transition: opacity 0.5s ease;
    }

    /* Custom Gradients from the React code */
    .text-gradient-solid {
      background-image: linear-gradient(to right, white 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.2) 80%, white 100%);
    }
    
    .text-gradient-plain {
      background-image: linear-gradient(to right, white, white);
    }

    /* Fade out the bottom of the card stack */
    .mask-b-from-10 {
      -webkit-mask-image: linear-gradient(to bottom, black 10%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 10%, transparent 100%);
    }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-black font-sans">

  <div class="flex h-screen w-full items-center justify-center bg-black">
    <div class="relative w-full max-w-4xl flex justify-center items-center">
      
      <!-- Text that shows on Hover -->
      <h1 id="text-solid" class="absolute top-1/2 left-1/2 z-50 mx-auto w-fit -translate-x-1/2 -translate-y-1/2 text-center text-xl font-bold tracking-tight whitespace-nowrap md:text-5xl bg-clip-text py-4 text-transparent opacity-transition text-gradient-solid opacity-0 pointer-events-none duration-500">
        Inspired by the pros. Made for you.
      </h1>

      <!-- Text that shows when Idle -->
      <h1 id="text-gradient" class="absolute top-1/2 left-1/2 z-50 mx-auto w-fit -translate-x-1/2 -translate-y-1/2 text-center text-xl font-bold tracking-tight whitespace-nowrap md:text-5xl bg-clip-text py-4 text-transparent opacity-transition text-gradient-plain opacity-100 pointer-events-none duration-500">
        Inspired by the pros. Made for you.
      </h1>

      <!-- Cards Container (h-120 in tailwind is 30rem) -->
      <div id="card-container" class="relative flex h-[30rem] w-96 mask-b-from-10 opacity-0 translate-y-4 transition-all duration-700 ease-out">
        
        <!-- Base Main Image -->
        <img
          src="https://assets.aceternity.com/labs/main.webp"
          alt="Hero Base"
          class="absolute inset-y-0 left-0 h-[30rem] w-40 object-contain"
        />

        <!-- Card 1 -->
        <div class="fey-card group absolute -bottom-2 left-[32px] z-20 h-[30rem] w-40 cursor-pointer">
          <div class="relative h-full w-full spring-transition card-inner">
            <img src="https://assets.aceternity.com/labs/1.webp" class="active-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-0 opacity-transition group-hover:opacity-100" />
            <img src="https://assets.aceternity.com/labs/idle.webp" class="idle-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-100 opacity-transition group-hover:opacity-0" />
            <!-- The dark corner shadow -->
            <div class="absolute top-8 left-2 z-50 h-full w-4 bg-black blur-md pointer-events-none"></div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="fey-card group absolute -bottom-2 left-[64px] z-20 h-[30rem] w-40 cursor-pointer">
          <div class="relative h-full w-full spring-transition card-inner">
            <img src="https://assets.aceternity.com/labs/2.webp" class="active-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-0 opacity-transition group-hover:opacity-100" />
            <img src="https://assets.aceternity.com/labs/idle.webp" class="idle-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-100 opacity-transition group-hover:opacity-0" />
            <div class="absolute top-8 left-2 z-50 h-full w-4 bg-black blur-md pointer-events-none"></div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="fey-card group absolute -bottom-2 left-[96px] z-20 h-[30rem] w-40 cursor-pointer">
          <div class="relative h-full w-full spring-transition card-inner">
            <img src="https://assets.aceternity.com/labs/3.webp" class="active-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-0 opacity-transition group-hover:opacity-100" />
            <img src="https://assets.aceternity.com/labs/idle.webp" class="idle-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-100 opacity-transition group-hover:opacity-0" />
            <div class="absolute top-8 left-2 z-50 h-full w-4 bg-black blur-md pointer-events-none"></div>
          </div>
        </div>

        <!-- Card 4 -->
        <div class="fey-card group absolute -bottom-2 left-[128px] z-20 h-[30rem] w-40 cursor-pointer">
          <div class="relative h-full w-full spring-transition card-inner">
            <img src="https://assets.aceternity.com/labs/4.webp" class="active-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-0 opacity-transition group-hover:opacity-100" />
            <img src="https://assets.aceternity.com/labs/idle.webp" class="idle-img absolute inset-0 aspect-[9/16] h-full w-full object-contain opacity-100 opacity-transition group-hover:opacity-0" />
            <div class="absolute top-8 left-2 z-50 h-full w-4 bg-black blur-md pointer-events-none"></div>
          </div>
        </div>

        <!-- Card 5 (No Idle Swap, just standard opacity transition) -->
        <div class="fey-card group absolute -bottom-2 left-[160px] z-20 h-[30rem] w-40 cursor-pointer">
          <div class="relative h-full w-full spring-transition card-inner">
            <img src="https://assets.aceternity.com/labs/5.webp" class="absolute inset-0 aspect-[9/16] h-full w-full object-contain transition-opacity duration-300" />
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.fey-card');
      const textSolid = document.getElementById('text-solid');
      const textGradient = document.getElementById('text-gradient');
      const cardContainer = document.getElementById('card-container');
      
      let activeIndex = null;
      const shiftDistance = 60; // How far the trailing cards get pushed

      // Initial Entrance Animation
      setTimeout(() => {
        cardContainer.classList.remove('opacity-0', 'translate-y-4');
      }, 100);

      function updateUI() {
        const isHovered = activeIndex !== null;

        // Toggle Background Typography
        textSolid.style.opacity = isHovered ? '1' : '0';
        textGradient.style.opacity = isHovered ? '0' : '1';

        // Update Card Shifts & Opacities
        cards.forEach((card, index) => {
          const innerCard = card.querySelector('.card-inner');
          const shouldShift = isHovered && index > activeIndex;
          const isActive = activeIndex === index;
          
          // Apply horizontal shift to subsequent cards
          if (shouldShift) {
            innerCard.style.transform = `translateX(${shiftDistance}px)`;
          } else {
            innerCard.style.transform = `translateX(0px)`;
          }

          // Force active state styles for the specifically hovered/clicked card
          const activeImg = card.querySelector('.active-img');
          const idleImg = card.querySelector('.idle-img');

          if (activeImg && idleImg) {
             if(isActive) {
                activeImg.style.opacity = '1';
                idleImg.style.opacity = '0';
             } else {
                activeImg.style.opacity = ''; 
                idleImg.style.opacity = '';
             }
          }
        });
      }

      // Event Listeners for Hover and Click
      cards.forEach((card, index) => {
        card.addEventListener('mouseenter', () => {
          activeIndex = index;
          updateUI();
        });
        
        card.addEventListener('mouseleave', () => {
          activeIndex = null;
          updateUI();
        });

        card.addEventListener('click', () => {
          activeIndex = activeIndex === index ? null : index;
          updateUI();
        });
      });
    });
  </script>
</body>
</html>
